# На feature-ветках — одна job (тесты дашборда + зеркало в GitHub), без Auto-DevOps.
# Образ Python тяжелее alpine/git, но по-прежнему один слот runner'а на пайплайн.
# Полный Auto-DevOps — в .gitlab-ci-autodevops.yml (только $CI_DEFAULT_BRANCH).
workflow:
  rules:
    - when: always

stages:
  - deploy

# Push current branch to GitHub (Streamlit Community Cloud reads only GitHub).
# Before push: install deps + run webmaster-pipeline-dashboard unit tests (stdlib unittest).
# One job = one runner slot (same constraint as alpine/git mirror-only).
# Set CI/CD variable GITHUB_TOKEN: classic PAT with "repo" scope (GitHub account that owns github.com/otsebulevsky-alt/linkbuilding).
mirror_github_streamlit:
  stage: deploy
  image: python:3.12-slim-bookworm
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $GITHUB_TOKEN
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --no-cache-dir -r requirements.txt
  script:
    - cd webmaster-pipeline-dashboard && python -m unittest discover -s tests -p "test_*.py" -q && cd ..
    - git config user.email "o.tsebulevsky@rantsports.com"
    - git config user.name "Oleg Tsebulevsky"
    - git fetch --unshallow 2>/dev/null || true
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://oauth2:${GITHUB_TOKEN}@github.com/otsebulevsky-alt/linkbuilding.git"
    - git push github "HEAD:refs/heads/${CI_COMMIT_REF_NAME}"

include:
  - local: .gitlab-ci-autodevops.yml
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
