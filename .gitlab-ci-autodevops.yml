# Auto-DevOps + secret detection только на default branch (main).
# На feature-ветках этот файл не подключается — см. корневой .gitlab-ci.yml.
stages:
  - build
  - test
  - deploy
  - review
  - dast
  - staging
  - canary
  - production
  - incremental rollout 10%
  - incremental rollout 25%
  - incremental rollout 50%
  - incremental rollout 100%
  - performance
  - cleanup
  - secret-detection
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
include:
  - template: Auto-DevOps.gitlab-ci.yml
