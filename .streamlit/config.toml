# Используется, если Main file path в Cloud = корневой `app.py`.
# Не задавайте server.port / server.address — см. webmaster-pipeline-dashboard/.streamlit/config.toml
[server]
headless = true
# none — полностью без watcher (на Community Cloud после «Processed dependencies» бывает SIGSEGV даже с poll).
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
